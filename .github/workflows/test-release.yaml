name: Test Release

on:
  workflow_dispatch:  # 允许手动触发
  pull_request:
    paths:
      - '.goreleaser.yml'
      - 'package/nfpm-*-rpm.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/test-release.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run unit tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Test GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Build snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish,docker

      - name: Verify artifacts
        run: |
          echo "Generated artifacts:"
          ls -lh dist/*.tar.gz || true
          ls -lh dist/*.rpm
          shopt -s nullglob
          rpms=(dist/*.rpm)
          test "${#rpms[@]}" -gt 0
          for rpm in "${rpms[@]}"; do
            [[ "$(basename "$rpm")" == pg-exporter-*.rpm ]] || {
              echo "::error file=.goreleaser.yml::unexpected RPM artifact name: $(basename "$rpm")"
              exit 1
            }
          done
          echo ""
          echo "Checksums:"
          cat dist/checksums.txt || true
